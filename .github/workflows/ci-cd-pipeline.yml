name: CI-CD-Pipeline

on:
  push:
    branches:
      - main

# The droplet has a single vCPU. Serialize deploys so two runs never race on it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DO_REGISTRY: registry.digitalocean.com/tools-intern
  IMAGE_NAME: github-pm-dashboard
  DEPLOY_DIR: github-pm-dashboard

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Linting
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flake8
          flake8 dashboard.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Setup Digital Ocean CLI
        run: |
          cd ~
          wget -q https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz
          tar xf doctl-1.104.0-linux-amd64.tar.gz
          sudo mv doctl /usr/local/bin
          rm doctl-1.104.0-linux-amd64.tar.gz
          doctl auth init --access-token ${{ secrets.DO_TOKEN }}
          doctl registry login --expiry-seconds 3600

      # Build on the runner, not on the droplet: the droplet has 1 vCPU and
      # ~1 GB of RAM with no swap. Tagged with the commit SHA so a rollback is
      # just IMAGE_TAG plus `docker compose up -d`.
      - name: Build and Push Docker Image
        run: |
          docker pull ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            || echo "No existing image found, building from scratch."

          DOCKER_BUILDKIT=1 docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

          docker push ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Set up SSH for Deployment
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Deploy to DigitalOcean Droplet
        run: |
          DROPLET_IP=${{ secrets.DROPLET_IP }}
          echo "Deploying ${{ github.sha }} to $DROPLET_IP"

          # The droplet keeps its own .env (secrets plus DO_REGISTRY /
          # IMAGE_NAME). It is gitignored, so `git clean -fd` leaves it in place
          # and CI never writes secrets to the host — only the IMAGE_TAG line is
          # rewritten, on the droplet, below.
          #
          # No `sudo` on the docker commands: the deploy user is in the docker
          # group, and sudo would reset HOME to /root, where the registry
          # credentials written by `doctl registry login` do not exist.
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@$DROPLET_IP << ENDSSH
            set -e
            cd ${{ env.DEPLOY_DIR }}

            git fetch --all
            git checkout main || git checkout -b main origin/main
            git reset --hard origin/main
            git clean -fd
            echo "Synchronized to: \$(git rev-parse --short HEAD)"

            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|" .env

            doctl auth init --access-token ${{ secrets.DO_TOKEN }}
            doctl registry login

            docker compose pull
            docker compose up -d
            docker image prune -af
          ENDSSH

      - name: Verify Deployment
        run: |
          DROPLET_IP=${{ secrets.DROPLET_IP }}
          ssh -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@$DROPLET_IP << ENDSSH
            set -e
            cd ${{ env.DEPLOY_DIR }}
            docker compose ps

            sleep 10
            STATUS=\$(docker compose exec -T nginx \
              wget -q -O /dev/null -S http://dashboard:8050/login 2>&1 \
              | awk '/HTTP\//{print \$2}' | tail -1)

            if [ "\$STATUS" = "200" ]; then
              echo "Dashboard is responding (HTTP \$STATUS)"
            else
              echo "Health check failed (HTTP \$STATUS)"
              docker compose logs --tail 50 dashboard
              exit 1
            fi
          ENDSSH
